<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収益計算機 | 吉祥寺NEPO</title>
  <meta name="description" content="吉祥寺NEPOライブハウス専用の収益・チャージバック自動計算ツール。チケット枚数を入力するだけで総売上・演者バック・@miyaへのバックを自動計算。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --card: #1a1a1c;
      --border: #272729;
      --border-subtle: rgba(255,255,255,0.04);
      --accent: #c9a060;
      --accent-bright: #ddb878;
      --accent-dim: rgba(201,160,96,0.12);
      --accent-dim2: rgba(201,160,96,0.06);
      --success: #4ade80;
      --success-dim: rgba(74,222,128,0.1);
      --danger: #f87171;
      --danger-dim: rgba(248,113,113,0.1);
      --warning: #fbbf24;
      --warning-dim: rgba(251,191,36,0.1);
      --text: #e8e8ea;
      --text-muted: #8a8a8e;
      --text-faint: #48484e;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 980px; margin: 0 auto;
      padding: 0 20px; height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 11px; }
    .logo-mark {
      width: 34px; height: 34px;
      background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.5px;
    }
    .logo-text strong { display: block; font-size: 14px; font-weight: 700; }
    .logo-text small  { font-size: 10px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
    #header-day-info  { font-size: 12px; color: var(--text-faint); }

    /* ─── Layout ─── */
    .main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; display: flex; flex-direction: column; gap: 16px; }

    /* ─── Card ─── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-head {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(255,255,255,0.015);
    }
    .card-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
    .card-meta  { font-size: 11px; color: var(--text-faint); }
    .card-body  { padding: 20px; }

    /* ─── Date row ─── */
    .date-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
    .field label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
    input[type="date"] {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-family: inherit; font-size: 15px; padding: 10px 14px;
      outline: none; transition: border-color .2s, box-shadow .2s; color-scheme: dark; width: 100%;
    }
    input[type="date"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,160,96,.12); }
    .day-pill {
      padding: 9px 18px; border-radius: 20px; font-size: 12px; font-weight: 700;
      letter-spacing: .04em; flex-shrink: 0; white-space: nowrap; transition: all .3s;
    }
    .day-pill.weekday { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(201,160,96,.25); }
    .day-pill.friday  { background: var(--success-dim); color: var(--success); border: 1px solid rgba(74,222,128,.25); }

    /* ─── Tier bar ─── */
    .tier-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; }
    .tier-pill {
      padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
      white-space: nowrap; transition: all .25s;
    }
    .tier-pill.active { background: var(--accent-dim); border-color: rgba(201,160,96,.4); color: var(--accent); }

    /* ─── Table ─── */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    thead th {
      padding: 10px 12px; font-size: 10px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-muted); text-align: center;
      border-bottom: 1px solid var(--border); white-space: nowrap;
      background: rgba(255,255,255,.015);
    }
    thead th:first-child { text-align: left; padding-left: 20px; }
    thead th:last-child  { padding-right: 20px; }
    tbody tr { transition: background .15s; }
    tbody tr:hover td { background: rgba(255,255,255,.025); }
    tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border-subtle); }
    tbody td { padding: 11px 12px; vertical-align: middle; }
    tbody td:first-child { padding-left: 20px; }
    tbody td:last-child  { padding-right: 20px; text-align: right; }

    /* Performer name cell */
    .pname { display: flex; align-items: center; gap: 7px; min-width: 140px; }
    .drag-handle {
      color: var(--text-faint); font-size: 14px; cursor: grab; flex-shrink: 0;
      user-select: none; padding: 2px; transition: color .15s;
    }
    .drag-handle:hover { color: var(--text-muted); }
    .pname-input {
      background: transparent; border: none;
      border-bottom: 1px dashed var(--border);
      color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500;
      padding: 2px 4px; outline: none; max-width: 140px; width: 100%;
      transition: border-color .2s;
    }
    .pname-input:focus { border-color: var(--accent); }
    .remove-btn {
      width: 22px; height: 22px; border-radius: 4px; border: none;
      background: transparent; color: var(--text-faint); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--danger); background: var(--danger-dim); }

    /* Oen checkbox column */
    .oen-check-wrap { display: flex; align-items: center; justify-content: center; }
    .oen-check {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 5px;
      border: 1.5px solid var(--border); background: var(--surface);
      cursor: pointer; position: relative; transition: all .18s; flex-shrink: 0;
    }
    .oen-check:checked {
      background: linear-gradient(135deg, var(--accent), var(--success));
      border-color: transparent;
    }
    .oen-check:checked::after {
      content: '✓'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); font-size: 11px; font-weight: 700; color: #0a0a0a;
    }
    .oen-check:hover { border-color: var(--accent); }

    /* Stepper */
    .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .step-btn {
      width: 28px; height: 28px; border-radius: var(--radius-xs);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); font-size: 16px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .15s; flex-shrink: 0; user-select: none;
    }
    .step-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .step-btn:active { transform: scale(.88); }
    .step-input {
      width: 46px; text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-xs);
      color: var(--text); font-family: inherit; font-size: 14px; font-weight: 700;
      padding: 4px 2px; outline: none; transition: border-color .2s;
      -moz-appearance: textfield;
    }
    .step-input::-webkit-inner-spin-button,
    .step-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .step-input:focus { border-color: var(--accent); }

    /* Norma / amount */
    .norma-pill { display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .norma-pill.ok    { background: var(--success-dim); color: var(--success); }
    .norma-pill.exact { background: var(--warning-dim); color: var(--warning); }
    .norma-pill.ng    { background: var(--danger-dim);  color: var(--danger);  }
    .norma-pill.none  { background: transparent; color: var(--text-faint); font-style: italic; }
    .amt { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .amt.pos  { color: var(--success); }
    .amt.neg  { color: var(--danger);  }
    .amt.zero { color: var(--text-faint); }

    /* Oen footer */
    .oen-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      background: rgba(201,160,96,.05);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .oen-meta { flex: 1; min-width: 180px; }
    .oen-meta strong { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
    .oen-meta span   { font-size: 11px; color: var(--text-faint); margin-top: 2px; display: block; }
    .oen-inputs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .oen-label  { font-size: 11px; color: var(--text-muted); }
    .oen-subtotal { flex-shrink: 0; text-align: right; min-width: 100px; }
    .oen-subtotal .sub { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
    .oen-subtotal .val { font-size: 16px; font-weight: 700; color: var(--accent); }

    /* Oen target names */
    .oen-targets {
      font-size: 11px; color: var(--accent);
      background: var(--accent-dim2); border: 1px solid rgba(201,160,96,.2);
      border-radius: 6px; padding: 3px 8px; display: inline-block; margin-top: 3px;
    }

    /* Add / reset buttons row */
    .table-footer-row {
      display: flex; gap: 0; border-top: 1px solid var(--border);
    }
    .add-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      flex: 1; padding: 12px; background: transparent; border: none;
      color: var(--text-muted); font-family: inherit; font-size: 13px;
      cursor: pointer; transition: all .2s;
    }
    .add-btn:hover { color: var(--accent); background: var(--accent-dim2); }
    .reset-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 18px; background: transparent; border: none; border-left: 1px solid var(--border);
      color: var(--text-faint); font-family: inherit; font-size: 12px;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .reset-btn:hover { color: var(--warning); background: var(--warning-dim); }

    /* ─── Summary ─── */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .sitem { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
    .sitem.full { grid-column: 1 / -1; }
    .sitem.accent-item { background: var(--accent-dim2); border-color: rgba(201,160,96,.25); }
    .sitem.venue-item  { border-color: rgba(201,160,96,.5); border-top-width: 2px; }
    .slabel { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .svalue { font-size: 22px; font-weight: 700; letter-spacing: -.03em; color: var(--text); }
    .accent-item .svalue { color: var(--accent); }
    .ssub { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
    .rate-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700;
      background: var(--accent-dim); color: var(--accent); transition: all .3s;
    }
    .section-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; margin-top: 16px; }
    .breakdown-list { display: flex; flex-direction: column; gap: 5px; }
    .bitem {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-xs); transition: background .15s;
    }
    .bitem:hover { background: var(--card); }
    .bitem .bname { font-size: 13px; color: var(--text-muted); }
    .bitem .bval  { font-size: 13px; font-weight: 700; }
    .bitem .bval.pos  { color: var(--success); }
    .bitem .bval.neg  { color: var(--danger);  }
    .bitem .bval.zero { color: var(--text-faint); }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .2s; border: none;
      letter-spacing: .02em; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #0a0a0a; }
    .btn-primary:hover { background: var(--accent-bright); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,160,96,.28); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); background: rgba(255,255,255,.04); }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-danger-ghost { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,.25); font-size: 12px; padding: 7px 14px; }
    .btn-danger-ghost:hover { background: var(--danger-dim); }

    /* ─── Save ─── */
    .save-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .note-input {
      flex: 1; min-width: 180px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-family: inherit; font-size: 14px;
      padding: 10px 14px; outline: none; transition: border-color .2s;
    }
    .note-input::placeholder { color: var(--text-faint); }
    .note-input:focus { border-color: var(--accent); }

    /* ─── History ─── */
    .history-empty { text-align: center; padding: 48px 20px; color: var(--text-faint); font-size: 13px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .hcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: border-color .2s; }
    .hcard:hover { border-color: rgba(201,160,96,.3); }
    .hcard-head { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .hcard-date { flex: 1; }
    .hcard-date strong { font-size: 14px; font-weight: 600; display: block; }
    .hcard-date span   { font-size: 11px; color: var(--text-faint); }
    .hcard-total  { font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .hcard-chevron { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 11px; transition: transform .25s; flex-shrink: 0; }
    .hcard.open .hcard-chevron { transform: rotate(180deg); }
    .hcard-body { display: none; padding: 14px 16px; border-top: 1px solid var(--border); }
    .hcard.open .hcard-body { display: block; }
    .hdetail-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 8px; margin-bottom: 12px; }
    .hd-item { padding: 8px 10px; background: var(--card); border-radius: var(--radius-xs); border: 1px solid var(--border); }
    .hd-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
    .hd-value { font-size: 14px; font-weight: 700; margin-top: 3px; }
    .hperf-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
    .hperf-row:last-child { border-bottom: none; }
    .hperf-name { font-size: 12px; color: var(--text-muted); }
    .hperf-val  { font-size: 12px; font-weight: 700; }
    .hcard-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

    /* ─── Toast ─── */
    .toast {
      position: fixed; bottom: 28px; right: 24px;
      padding: 12px 20px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; box-shadow: var(--shadow); z-index: 1000;
      transform: translateY(70px); opacity: 0;
      transition: all .35s cubic-bezier(0.34,1.56,0.64,1);
      border: 1px solid var(--border); background: var(--card); max-width: 280px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok  { color: var(--success); border-color: rgba(74,222,128,.35); }
    .toast.err { color: var(--danger);  border-color: rgba(248,113,113,.35); }

    /* ─── Divider ─── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .header-inner { padding: 0 14px; }
      .main { padding: 16px 12px 80px; gap: 12px; }
      .card-body { padding: 14px; }
      .summary-grid { grid-template-columns: 1fr; }
      .sitem.full { grid-column: 1; }
      .svalue { font-size: 19px; }
      .oen-footer { flex-direction: column; align-items: flex-start; gap: 10px; }
      .oen-subtotal { align-self: flex-end; }
      .save-row { flex-direction: column; }
      .btn-primary { width: 100%; justify-content: center; }
      .toast { right: 12px; left: 12px; max-width: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">N</div>
      <div class="logo-text">
        <strong>吉祥寺NEPO</strong>
        <small>収益計算機</small>
      </div>
    </div>
    <span id="header-day-info"></span>
  </div>
</header>

<main class="main">

  <!-- ① Event setup -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">イベント設定</span>
    </div>
    <div class="card-body">
      <div class="date-row">
        <div class="field">
          <label for="event-date">開催日</label>
          <input type="date" id="event-date">
        </div>
        <div id="day-pill" class="day-pill weekday">月〜木</div>
      </div>
      <div style="margin-top:16px;">
        <div class="slabel" style="margin-bottom:4px;">@miyaバック率の目安 <span id="tier-day-label" style="font-style:italic;font-weight:400;"></span></div>
        <div class="tier-bar" id="tier-bar"></div>
      </div>
    </div>
  </section>

  <!-- ② Ticket input -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">チケット枚数入力</span>
      <span class="card-meta">現地 ¥2,500 ／ ツイキャス ¥2,000 ｜ ノルマ 3枚</span>
    </div>

    <div class="table-scroll">
      <table id="performer-table">
        <thead>
          <tr>
            <th>出演者</th>
            <th>現地</th>
            <th>ツイキャス</th>
            <th>合計枚数</th>
            <th>ノルマ</th>
            <th>バック/負担</th>
            <th title="応援チケットの売上・ノルマをこの演者に合算する">応援対象</th>
          </tr>
        </thead>
        <tbody id="performer-tbody"></tbody>
      </table>
    </div>

    <!-- Oen row -->
    <div class="oen-footer" id="oen-footer">
      <div class="oen-meta">
        <strong>🎉 応援チケット（合算）</strong>
        <span id="oen-target-names">対象演者なし（上の表でチェックを入れてください）</span>
      </div>
      <div class="oen-inputs">
        <span class="oen-label">現地</span>
        <div class="stepper">
          <button class="step-btn" onclick="adjustOen('onsite',-1)">−</button>
          <input class="step-input" type="number" id="oen-onsite" value="0" min="0" oninput="onOenInput('onsite',this.value)">
          <button class="step-btn" onclick="adjustOen('onsite',1)">＋</button>
        </div>
        <span class="oen-label">ツイキャス</span>
        <div class="stepper">
          <button class="step-btn" onclick="adjustOen('twitcast',-1)">−</button>
          <input class="step-input" type="number" id="oen-twitcast" value="0" min="0" oninput="onOenInput('twitcast',this.value)">
          <button class="step-btn" onclick="adjustOen('twitcast',1)">＋</button>
        </div>
      </div>
      <div class="oen-subtotal">

  <!-- ③ Summary -->
  <section class="card">

      <div class="rate-pill" id="miya-rate-pill">バック率 —%</div>
    </div>
    <div class="card-body">
      <div class="summary-grid">
        <div class="sitem full">
          <div class="slabel">総売上（チャージ計）</div>
          <div class="svalue" id="s-total">¥0</div>
        </div>
        <div class="sitem">
          <div class="slabel">演者バック合計</div>
          <div class="svalue" id="s-perf-back" style="color:var(--success);">¥0</div>
        </div>
        <div class="sitem">
          <div class="slabel">演者負担合計</div>
          <div class="svalue" id="s-perf-owed" style="color:var(--danger);">¥0</div>
        </div>
        <div class="sitem accent-item full">
          <div class="slabel">@miyaへのバック</div>
          <div class="svalue" id="s-miya">¥0</div>
          <div class="ssub" id="s-miya-sub">対象額：¥0 × 0%</div>
        </div>
        <div class="sitem venue-item full">
          <div class="slabel">会場手残り</div>
          <div class="svalue" id="s-venue">¥0</div>

      <div class="section-label">各出演者の明細</div>

  <!-- ④ Save -->
  <section class="card">
    <div class="card-head"><span class="card-title">保存</span></div>
    <div class="card-body">

        <button class="btn btn-primary" onclick="saveEvent()">
          <span>💾</span> この日のデータを保存
        </button>
      </div>
    </div>
  </section>

  <!-- ⑤ History -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">保存履歴</span>
      <span class="card-meta" id="history-count">0件</span>
    </div>
    <div class="card-body">
      <div id="history-container">
        <div class="history-empty">まだ保存されたデータはありません</div>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
  // ─── Constants ───────────────────────────────────────
  const NORMA        = 3;
  const PRICE_ONSITE = 2500;
  const PRICE_TC     = 2000;
  const STORAGE_KEY  = 'nepo_calc_v2';

  // ─── Default performers ──────────────────────────────
  // hasOen: true  → receives a share of oen (応援) ticket sales
  const DEFAULT_PERFORMERS = [
    { id:'makoto_ai',   name:'MakotoAI',        onsite:0, twitcast:0, hasOen:true  },
    { id:'momu',        name:'MoMu & TeaSteam', onsite:0, twitcast:0, hasOen:true  },
    { id:'jackpot031',  name:'JACKPOT031',       onsite:0, twitcast:0, hasOen:false },
    { id:'yousei_aaya', name:'妖精アーヤさん',     onsite:0, twitcast:0, hasOen:false },
    { id:'tbd_1',       name:'未定',             onsite:0, twitcast:0, hasOen:false }
  ];

  // ─── Tier tables ─────────────────────────────────────
  const TIERS = {
    weekday: [
      { min:0,      max:30000,   rate:0    },
      { min:30000,  max:50000,   rate:0.25 },
      { min:50000,  max:70000,   rate:0.30 },
      { min:70000,  max:100000,  rate:0.40 },
      { min:100000, max:Infinity,rate:0.50 }
    ],
    friday: [
      { min:0,      max:50000,   rate:0    },
      { min:50000,  max:70000,   rate:0.25 },
      { min:70000,  max:90000,   rate:0.30 },
      { min:90000,  max:120000,  rate:0.40 },
      { min:120000, max:Infinity,rate:0.50 }
    ]
  };

  const TIER_LABELS = {
    weekday: ['〜¥3万:0%','¥3〜5万:25%','¥5〜7万:30%','¥7〜10万:40%','¥10万〜:50%'],
    friday:  ['〜¥5万:0%','¥5〜7万:25%','¥7〜9万:30%','¥9〜12万:40%','¥12万〜:50%']
  };

  // ─── State ───────────────────────────────────────────
  let state = {
    date: today(),
    performers: deepClone(DEFAULT_PERFORMERS),
    oen: { onsite:0, twitcast:0 },
    saved: loadSaved()
  };

  // ─── Init ────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    const dateEl = document.getElementById('event-date');
    dateEl.value = state.date;
    dateEl.addEventListener('change', e => {
      state.date = e.target.value;
      updateDayInfo();
      recalc();
    });
    updateDayInfo();
    renderPerformerTable();
    recalc();
    renderHistory();
  });

  // ─── Day type ────────────────────────────────────────
  function getDayType(dateStr) {
    if (!dateStr) return 'weekday';
    const d = new Date(dateStr + 'T12:00:00');
    return d.getDay() === 5 ? 'friday' : 'weekday';
  }

  function updateDayInfo() {
    const dt   = getDayType(state.date);
    const d    = state.date ? new Date(state.date + 'T12:00:00') : null;
    const days = ['日','月','火','水','木','金','土'];
    const name = d ? days[d.getDay()] : '—';

    const pill = document.getElementById('day-pill');
    if (dt === 'friday') {
      pill.textContent = `金曜（${name}）`;
      pill.className = 'day-pill friday';
    } else {
      pill.textContent = `月〜木（${name}）`;
      pill.className = 'day-pill weekday';
    }
    document.getElementById('header-day-info').textContent = state.date ? `${state.date}（${name}）` : '';
    document.getElementById('tier-day-label').textContent = dt === 'friday' ? '(金曜)' : '(月〜木)';
    renderTierBar(dt);
  }

  function renderTierBar(dt) {
    document.getElementById('tier-bar').innerHTML =
      TIER_LABELS[dt].map((l,i) => `<div class="tier-pill" id="tp-${i}">${l}</div>`).join('');
  }

  function getMiyaRate(totalSales, dayType) {
    for (const t of (TIERS[dayType] || TIERS.weekday)) {
      if (totalSales >= t.min && totalSales < t.max) return t.rate;
    }
    return 0;
  }

  function getTierIndex(totalSales, dayType) {
    return (TIERS[dayType] || TIERS.weekday).findIndex(t => totalSales >= t.min && totalSales < t.max);
  }

  // ─── Performer calculation ────────────────────────────
  // hasOen performers get full oen ticket count for norma,
  // but split the revenue equally among all hasOen performers.
  function calcPerformer(p, oen, oenShareCount) {
    // oenShareCount = number of performers with hasOen=true (to split evenly)
    const share = oenShareCount > 0 ? 1 / oenShareCount : 0;

    const tickets = [
      { price: PRICE_ONSITE, count: p.onsite   || 0 },
      { price: PRICE_TC,     count: p.twitcast  || 0 }
    ];

    if (p.hasOen && share > 0) {
      // Count full oen tickets toward norma, but price is this performer's share
      tickets.push({ price: PRICE_ONSITE * share, count: oen.onsite   || 0 });
      tickets.push({ price: PRICE_TC     * share, count: oen.twitcast  || 0 });
    }

    // Flatten & sort descending (apply norma to cheapest last)
    let all = [];
    tickets.forEach(t => { for (let i = 0; i < t.count; i++) all.push(t.price); });
    all.sort((a, b) => b - a);

    const totalRev = all.reduce((s, v) => s + v, 0);
    let back = 0, owed = 0;

    if (all.length >= NORMA) {
      for (let i = NORMA; i < all.length; i++) back += all[i] * 0.5;
    } else {
      owed = (NORMA - all.length) * PRICE_ONSITE;
    }

    return { totalRev, back, owed, count: all.length };
  }

  // ─── Master calculation ───────────────────────────────
  function calculate() {
    const dayType = getDayType(state.date);
    const oen     = state.oen;

    const oenRev       = (oen.onsite || 0) * PRICE_ONSITE + (oen.twitcast || 0) * PRICE_TC;
    const oenShareCount = state.performers.filter(p => p.hasOen).length;

    const perfResults = state.performers.map(p => ({
      p, r: calcPerformer(p, oen, oenShareCount)
    }));

    // Total ticket sales (oen counted once, not once per hasOen performer)
    let totalSales = oenRev;
    state.performers.forEach(p => {
      totalSales += (p.onsite || 0) * PRICE_ONSITE + (p.twitcast || 0) * PRICE_TC;
    });

    let totalBack = 0, totalOwed = 0;
    perfResults.forEach(({ r }) => { totalBack += r.back; totalOwed += r.owed; });

    const miyaBase = totalSales + totalOwed - totalBack;
    const miyaRate = getMiyaRate(totalSales, dayType);
    const miyaBack = miyaBase * miyaRate;
    const venueNet = miyaBase - miyaBack;

    return { dayType, totalSales, oenRev, oenShareCount, totalBack, totalOwed, miyaBase, miyaRate, miyaBack, venueNet, perfResults };
  }

  // ─── Render performer table ───────────────────────────
  function renderPerformerTable() {
    const tbody = document.getElementById('performer-tbody');
    tbody.innerHTML = '';

    state.performers.forEach((p, idx) => {
      const tr = document.createElement('tr');
      tr.id = `pr-${idx}`;

      tr.innerHTML = `
        <td>
          <div class="pname">
            <input class="pname-input" type="text" value="${esc(p.name)}"
              oninput="updateName(${idx},this.value)" placeholder="名前を入力"
              title="クリックして名前を変更">
            <button class="remove-btn" onclick="removePerformer(${idx})" title="削除">×</button>
          </div>
        </td>
        <td>
          <div class="stepper">
            <button class="step-btn" onclick="adjust(${idx},'onsite',-1)">−</button>
            <input class="step-input" type="number" id="p${idx}-onsite" value="${p.onsite}" min="0"
              oninput="updateField(${idx},'onsite',this.value)">
            <button class="step-btn" onclick="adjust(${idx},'onsite',1)">＋</button>
          </div>
        </td>
        <td>
          <div class="stepper">
            <button class="step-btn" onclick="adjust(${idx},'twitcast',-1)">−</button>
            <input class="step-input" type="number" id="p${idx}-twitcast" value="${p.twitcast}" min="0"
              oninput="updateField(${idx},'twitcast',this.value)">
            <button class="step-btn" onclick="adjust(${idx},'twitcast',1)">＋</button>
          </div>
        </td>
        <td style="text-align:center;font-weight:700;" id="p${idx}-count">0</td>
        <td style="text-align:center;" id="p${idx}-norma"></td>
        <td><div class="amt zero" id="p${idx}-amt">¥0</div></td>
        <td>
          <div class="oen-check-wrap">
            <input type="checkbox" class="oen-check" id="p${idx}-oen"
              ${p.hasOen ? 'checked' : ''}
              onchange="toggleOen(${idx},this.checked)"
              title="応援チケットの売上・ノルマをこの演者に合算する">
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    updateOenTargetLabel();
  }

  // ─── Recalculate & update DOM ────────────────────────
  function recalc() {
    const res = calculate();

    // Active tier pill
    const tIdx = getTierIndex(res.totalSales, res.dayType);
    document.querySelectorAll('.tier-pill').forEach((el, i) => el.classList.toggle('active', i === tIdx));

    // Per-performer cells
    res.perfResults.forEach(({ p, r }, idx) => {
      const elCount = document.getElementById(`p${idx}-count`);
      const elNorma = document.getElementById(`p${idx}-norma`);
      const elAmt   = document.getElementById(`p${idx}-amt`);
      if (!elCount) return;

      elCount.textContent = r.count;

      if (r.count === 0 && (p.onsite || 0) === 0 && (p.twitcast || 0) === 0) {
        elNorma.innerHTML = `<span class="norma-pill none">—</span>`;
      } else if (r.count > NORMA) {
        elNorma.innerHTML = `<span class="norma-pill ok">達成 +${r.count - NORMA}枚</span>`;
      } else if (r.count === NORMA) {
        elNorma.innerHTML = `<span class="norma-pill exact">ちょうど</span>`;
      } else {
        elNorma.innerHTML = `<span class="norma-pill ng">不足 ${r.count}/${NORMA}</span>`;
      }

      if (r.back > 0) { elAmt.textContent = `+¥${fmt(r.back)}`; elAmt.className = 'amt pos'; }
      else if (r.owed > 0) { elAmt.textContent = `-¥${fmt(r.owed)} 負担`; elAmt.className = 'amt neg'; }
      else { elAmt.textContent = '¥0'; elAmt.className = 'amt zero'; }
    });

    // Oen subtotal
    document.getElementById('oen-subtotal-val').textContent = `¥${fmt(res.oenRev)}`;

    // Summary
    document.getElementById('s-total').textContent      = `¥${fmt(res.totalSales)}`;
    document.getElementById('s-perf-back').textContent  = `¥${fmt(res.totalBack)}`;
    document.getElementById('s-perf-owed').textContent  = `¥${fmt(res.totalOwed)}`;
    document.getElementById('s-miya').textContent       = `¥${fmt(res.miyaBack)}`;
    document.getElementById('s-miya-sub').textContent   = `対象額：¥${fmt(res.miyaBase)} × ${Math.round(res.miyaRate*100)}%`;
    document.getElementById('s-venue').textContent      = `¥${fmt(res.venueNet)}`;
    document.getElementById('miya-rate-pill').textContent = `バック率 ${Math.round(res.miyaRate*100)}%`;

    // Breakdown
    const bl = document.getElementById('breakdown-list');
    bl.innerHTML = '';
    res.perfResults.forEach(({ p, r }) => {
      const div = document.createElement('div');
      div.className = 'bitem';
      const cls  = r.back > 0 ? 'pos' : r.owed > 0 ? 'neg' : 'zero';
      const text = r.back > 0 ? `+¥${fmt(r.back)}` : r.owed > 0 ? `-¥${fmt(r.owed)} 負担` : '¥0';
      const oenTag = p.hasOen ? ' <span style="font-size:10px;color:var(--accent);">応援合算</span>' : '';
      div.innerHTML = `<span class="bname">${esc(p.name)}${oenTag}</span><span class="bval ${cls}">${text}</span>`;
      bl.appendChild(div);
    });

    if (res.oenRev > 0 && res.oenShareCount > 0) {
      const names = state.performers.filter(p => p.hasOen).map(p => p.name).join('・');
      const div = document.createElement('div');
      div.className = 'bitem';
      div.style.background = 'var(--accent-dim2)';
      div.innerHTML = `
        <span class="bname" style="color:var(--accent);">応援チケット小計</span>
        <span class="bval" style="color:var(--text-faint);">¥${fmt(res.oenRev)} → ${esc(names)} に均等分配</span>
      `;
      bl.appendChild(div);
    }
  }

  // ─── Oen target label ─────────────────────────────────
  function updateOenTargetLabel() {
    const targets = state.performers.filter(p => p.hasOen).map(p => p.name);
    const el = document.getElementById('oen-target-names');
    if (targets.length === 0) {
      el.innerHTML = '<span style="color:var(--text-faint);">対象演者なし（右の☑で演者を選択）</span>';
    } else {
      el.innerHTML = `<span class="oen-targets">✓ ${targets.map(esc).join(' & ')}</span> に均等分配`;
    }
  }

  // ─── Performer controls ───────────────────────────────
  function adjust(idx, field, delta) {
    state.performers[idx][field] = Math.max(0, (state.performers[idx][field] || 0) + delta);
    const el = document.getElementById(`p${idx}-${field}`);
    if (el) el.value = state.performers[idx][field];
    recalc();
  }

  function updateField(idx, field, val) {
    state.performers[idx][field] = Math.max(0, parseInt(val) || 0);
    recalc();
  }

  function updateName(idx, val) {
    state.performers[idx].name = val;
    updateOenTargetLabel();
    recalc();
  }

  function toggleOen(idx, val) {
    state.performers[idx].hasOen = val;
    updateOenTargetLabel();
    recalc();
  }

  function addPerformer() {
    state.performers.push({
      id: 'custom_' + Date.now(),
      name: '出演者名', onsite: 0, twitcast: 0, hasOen: false
    });
    renderPerformerTable();
    recalc();
    setTimeout(() => {
      const inputs = document.querySelectorAll('.pname-input');
      if (inputs.length) { inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].select(); }
    }, 50);
  }

  function removePerformer(idx) {
    if (state.performers.length <= 1) { showToast('最低1人は必要です', 'err'); return; }
    state.performers.splice(idx, 1);
    renderPerformerTable();
    recalc();
  }

  function resetPerformers() {
    if (!confirm('出演者リストをデフォルトに戻しますか？\n入力した枚数もリセットされます。')) return;
    state.performers = deepClone(DEFAULT_PERFORMERS);
    state.oen = { onsite: 0, twitcast: 0 };
    document.getElementById('oen-onsite').value   = 0;
    document.getElementById('oen-twitcast').value = 0;
    renderPerformerTable();
    recalc();
    showToast('デフォルトに戻しました', 'ok');
  }

  // ─── Oen controls ─────────────────────────────────────
  function adjustOen(field, delta) {
    state.oen[field] = Math.max(0, (state.oen[field] || 0) + delta);
    const el = document.getElementById(`oen-${field}`);
    if (el) el.value = state.oen[field];
    recalc();
  }

  function onOenInput(field, val) {
    state.oen[field] = Math.max(0, parseInt(val) || 0);
    recalc();
  }

  // ─── Save ─────────────────────────────────────────────
  function saveEvent() {
    if (!state.date) { showToast('開催日を設定してください', 'err'); return; }
    const note = document.getElementById('save-note').value.trim();
    const res  = calculate();

    const entry = {
      id: Date.now(),
      date: state.date,
      note,
      performers: deepClone(state.performers),
      oen: { ...state.oen },
      results: {
        totalSales: res.totalSales,
        totalBack:  res.totalBack,
        totalOwed:  res.totalOwed,
        miyaBase:   res.miyaBase,
        miyaRate:   res.miyaRate,
        miyaBack:   res.miyaBack,
        venueNet:   res.venueNet,
        dayType:    res.dayType
      }
    };

    const existIdx = state.saved.findIndex(e => e.date === state.date);
    if (existIdx >= 0) {
      if (!confirm(`${state.date} のデータは既に保存されています。上書きしますか？`)) return;
      state.saved[existIdx] = entry;
    } else {
      state.saved.unshift(entry);
    }

    persistSaved();
    document.getElementById('save-note').value = '';
    renderHistory();
    showToast('💾 保存しました！', 'ok');
  }

  // ─── History ──────────────────────────────────────────
  function renderHistory() {
    const container = document.getElementById('history-container');
    document.getElementById('history-count').textContent = `${state.saved.length}件`;

    if (!state.saved.length) {
      container.innerHTML = '<div class="history-empty">まだ保存されたデータはありません</div>';
      return;
    }

    const days = ['日','月','火','水','木','金','土'];
    container.innerHTML = '<div class="history-list" id="history-list"></div>';
    const list = document.getElementById('history-list');

    state.saved.forEach((ev, idx) => {
      const d       = new Date(ev.date + 'T12:00:00');
      const dateStr = `${ev.date}（${days[d.getDay()]}）`;
      const r       = ev.results;
      const oenShareCount = (ev.performers || []).filter(p => p.hasOen).length;

      const perfHtml = (ev.performers || []).map(p => {
        const pr = calcPerformer(p, ev.oen || {}, oenShareCount);
        const cls  = pr.back > 0 ? 'pos' : pr.owed > 0 ? 'neg' : 'zero';
        const text = pr.back > 0 ? `+¥${fmt(pr.back)}` : pr.owed > 0 ? `-¥${fmt(pr.owed)}` : '¥0';
        return `<div class="hperf-row">
          <span class="hperf-name">${esc(p.name)}${p.hasOen?' 🎉':''}</span>
          <span class="hperf-val ${cls}">${text}</span>
        </div>`;
      }).join('');

      const card = document.createElement('div');
      card.className = 'hcard';
      card.id = `hcard-${ev.id}`;
      card.innerHTML = `
        <div class="hcard-head" onclick="toggleHCard('${ev.id}')">
          <div class="hcard-date">
            <strong>${dateStr}</strong>
            ${ev.note ? `<span>${esc(ev.note)}</span>` : ''}
          </div>
          <div class="hcard-total">¥${fmt(r.totalSales)}</div>
          <div class="hcard-chevron">▼</div>
        </div>
        <div class="hcard-body">
          <div class="hdetail-grid">
            <div class="hd-item"><div class="hd-label">総売上</div><div class="hd-value">¥${fmt(r.totalSales)}</div></div>
            <div class="hd-item"><div class="hd-label">演者バック</div><div class="hd-value" style="color:var(--success);">¥${fmt(r.totalBack)}</div></div>
            <div class="hd-item"><div class="hd-label">@miyaバック (${Math.round((r.miyaRate||0)*100)}%)</div><div class="hd-value" style="color:var(--accent);">¥${fmt(r.miyaBack)}</div></div>
            <div class="hd-item"><div class="hd-label">会場手残り</div><div class="hd-value">¥${fmt(r.venueNet)}</div></div>
          </div>
          <div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">出演者明細</div>
          ${perfHtml}
          <div class="hcard-actions">
            <button class="btn btn-ghost btn-sm" onclick="loadEvent(${idx})">📥 読み込む</button>
            <button class="btn btn-danger-ghost" onclick="deleteEvent(${idx})">🗑 削除</button>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function toggleHCard(id) {
    const card = document.getElementById(`hcard-${id}`);
    if (card) card.classList.toggle('open');
  }

  function loadEvent(idx) {
    const ev = state.saved[idx];
    if (!ev) return;
    state.date       = ev.date;
    state.performers = deepClone(ev.performers);
    state.oen        = { ...ev.oen };
    document.getElementById('event-date').value   = state.date;
    document.getElementById('oen-onsite').value   = state.oen.onsite   || 0;
    document.getElementById('oen-twitcast').value = state.oen.twitcast || 0;
    updateDayInfo();
    renderPerformerTable();
    recalc();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('📥 データを読み込みました', 'ok');
  }

  function deleteEvent(idx) {
    if (!confirm('このデータを削除しますか？')) return;
    state.saved.splice(idx, 1);
    persistSaved();
    renderHistory();
    showToast('削除しました', 'ok');
  }

  // ─── Storage ──────────────────────────────────────────
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function persistSaved() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.saved)); }

  // ─── Utils ────────────────────────────────────────────
  function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function today() { return new Date().toISOString().split('T')[0]; }

  let toastTimer;
  function showToast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }
</script>
</body>
</html>
